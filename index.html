<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JANスキャナー">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>JANスキャナー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="view-scan" class="view active">
    <div class="row scan-opts">
      <select id="store-sel" aria-label="いまの店"></select>
      <button id="btn-price-mode" class="chip"></button>
    </div>
    <div class="seg" id="kind-seg">
      <button data-kind="new" class="on">新品</button>
      <button data-kind="used">中古</button>
    </div>
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
      <div id="flash"></div>
    </div>
    <p id="status">スキャン開始を押してください</p>
    <div id="last" class="last"></div>
    <div class="row">
      <button id="btn-toggle" class="primary">スキャン開始</button>
    </div>
    <p class="hint" id="scan-hint"></p>
  </section>

  <section id="view-list" class="view">
    <div class="row between">
      <strong id="count">0件</strong>
      <span>
        <button id="btn-csv">CSV</button>
        <button id="btn-json">JSON</button>
      </span>
    </div>
    <div class="row between">
      <span id="unexp" class="hint"></span>
      <label class="hint"><input type="checkbox" id="chk-all"> 書き出し済みも含めて全件</label>
    </div>
    <button id="btn-fetch" class="wide" style="display:none"></button>
    <div class="seg" id="filter-seg">
      <button data-filter="all" class="on">全て</button>
      <button data-filter="new">新品</button>
      <button data-filter="used">中古</button>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="hint">まだ記録がありません。</p>
  </section>

  <section id="view-settings" class="view">
    <h2>Amazonの価格</h2>
    <p class="hint">読み取った直後に、Amazonの価格と「この値段以下なら仕入れてよい」上限を表示します。</p>
    <div class="seg" id="prov-seg">
      <button data-p="off">使わない</button>
      <button data-p="keepa">Keepa</button>
      <button data-p="spapi">SP-API</button>
      <button data-p="mock">お試し</button>
    </div>
    <p class="hint">「お試し」は架空の数字です。サーバーなしで画面の動きを確かめられます。</p>
    <div id="server-fields">
      <label class="field">サーバーのURL<input id="set-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://jan-scanner-api.○○.workers.dev"></label>
      <label class="field">合言葉<input id="set-code" type="password" autocomplete="off"></label>
    </div>
    <div class="row"><button id="btn-test">つながるか試す</button><span id="test-result" class="hint"></span></div>

    <h2>仕入れ判定の基準</h2>
    <label class="check"><input type="checkbox" id="set-fba"> FBAで売る（FBA手数料を引く）</label>
    <div class="grid2">
      <label class="field">最低の利益（円）<input id="set-profit" type="number" inputmode="numeric" min="0"></label>
      <label class="field">最低のROI（%）<input id="set-roi" type="number" inputmode="numeric" min="0"></label>
      <label class="field">送料（1個・円）<input id="set-ship" type="number" inputmode="numeric" min="0"></label>
      <label class="field">その他経費（1個・円）<input id="set-other" type="number" inputmode="numeric" min="0"></label>
    </div>
    <p class="hint">◎＝利益とROIの両方が基準以上。価格は調べた時点のものなので、仕入れる前にAmazonのページでも確かめてください。</p>
  </section>
</main>

<!-- 読み取ったあとに出る価格入力パネル -->
<div id="panel" class="sheet" hidden>
  <div class="sheet-body">
    <div class="sheet-head">
      <div>
        <div id="p-jan" class="jan"></div>
        <div id="p-sub" class="p-sub"></div>
      </div>
      <button id="p-cancel">やめる</button>
    </div>
    <div id="p-hist" class="hist"></div>
    <div id="p-amz"></div>
    <div class="tax-row">
      <div class="seg" id="p-rate">
        <button data-rate="10">10%</button><button data-rate="8">8%</button>
      </div>
      <div class="seg" id="p-basis">
        <button data-basis="tax_included">税込</button><button data-basis="tax_excluded">税別</button>
      </div>
    </div>
    <div id="p-price" class="price-display"></div>
    <div id="p-entered" class="entered"></div>
    <div id="p-cmp" class="cmp"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="00">00</button><button data-k="0">0</button><button data-k="del" aria-label="1文字消す">⌫</button>
    </div>
    <div class="row">
      <button id="p-skip">価格なしで登録</button>
      <button id="p-ok" class="primary">登録</button>
    </div>
  </div>
</div>

<nav>
  <button id="tab-scan" class="tab active">スキャン</button>
  <button id="tab-list" class="tab">一覧</button>
  <button id="tab-settings" class="tab">設定</button>
</nav>

<script src="vendor/zxing-reader.js"></script>
<script src="db.js"></script>
<script src="price-provider.js"></script>
<script src="scanner.js"></script>
<script src="app.js"></script>
</body>
</html>
