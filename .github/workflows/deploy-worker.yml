# main に入ったら、テストをしてから価格のサーバー（worker/）を Cloudflare Workers に配置する。
# GitHub の Settings → Secrets and variables → Actions に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を入れると動く。
# 入れていないあいだは、テストだけして配置は飛ばす。
name: deploy-worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'research/src/core/**', '.github/workflows/deploy-worker.yml']
  pull_request:
    paths: ['worker/**', 'research/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: research のテスト
        working-directory: research
        run: npm test
      - name: worker のテスト
        working-directory: worker
        run: npm test
      - name: Cloudflare Workers に配置
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx -y wrangler@4 deploy
